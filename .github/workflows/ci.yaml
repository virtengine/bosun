name: "CI"

# Why both branches are listed:
# The estate uses a two-tier merge model (ESTATE standing rule 1) — every
# change lands on `develop` first via PR, and `develop` is promoted to `main`
# by the standing integration PR. Gating only on `main` therefore left every
# develop-based PR with no build/test coverage at all: the only checks that
# fired on such a PR were `Attach Bosun marker` and `npm audit (root + desktop)`.
# Measured on PR #569 (merged as 70a4d373) and PR #580 — base `develop`, two
# checks, no `Build + Tests`.
#
# `push: develop` is deliberate too: it proves the merged tip of `develop`
# itself, rather than only each PR head, so a bad merge cannot slip a red
# `develop` in behind green per-PR runs.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: "Build + Tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Prepublish check (files array + import validation)
        run: node tools/prepublish-check.mjs

      # Vendored bundles are invisible to dependabot (they appear in no
      # manifest), so a re-vendored bundle carrying an old DOMPurify would
      # never raise an alert. This gate is the only channel that can see it.
      - name: Vendored DOMPurify floor gate
        run: node tools/check-vendored-dompurify.mjs

      - name: Prompt lint
        run: npm run prompt:lint

      - name: Packed CLI smoke test
        run: npm run smoke:packed-cli

      - name: Run build
        run: npm run build

      # The MUI/emotion bundles under ui/vendor and site/ui/vendor are committed
      # build artifacts. Regenerate them into a scratch dir and fail on any
      # drift, so a committed bundle can never contradict its own generator.
      - name: MUI vendor bundle freshness
        run: node tools/build-vendor-mui.mjs --check

      # The preact/htm/signals/es-module-shims bundles under ui/vendor are
      # committed copies of node_modules bytes. They drift silently whenever a
      # dependency is bumped without re-vendoring, so re-resolve them into a
      # scratch dir and fail on any drift. Independent of the MUI gate above:
      # neither generator writes the other's files, so a failure in one must
      # never mask the other.
      - name: Vendor sync freshness
        run: node tools/vendor-sync.mjs --check

      # npm install lifecycle hooks, `npm run build`, and `npm test` can regenerate
      # these files before this check runs. The generator's --check is necessary
      # but insufficient after an in-place sync; compare against the checked-out
      # commit too, so a stale committed artifact cannot self-heal in CI.
      - name: Demo defaults freshness
        run: node tools/generate-demo-defaults.mjs --check && git diff --exit-code HEAD -- ui/demo-defaults.js site/ui/demo-defaults.js

      # site/ui/ mirrors ui/ for every file sync-demo-ui.mjs copies (all of
      # ROOT_FILES + ROOT_DIRS). The three HTML pages and demo-defaults.js are
      # not mirrored and are owned by the gates above. Catches a half-run sync
      # and an orphan left behind after a source deletion. This gate also compares
      # the mirror with HEAD because npm run build syncs it before CI reaches here.
      - name: Demo UI mirror freshness
        run: node tools/sync-demo-ui.mjs --check && git diff --exit-code HEAD -- site/ui

      - name: Audit conformity gate
        if: ${{ vars.BOSUN_AUDIT_CI == '1' }}
        run: npm run audit:ci

      - name: Native call parity gate
        run: npm run check:native-call-parity

      - name: Run tests
        run: npm test

