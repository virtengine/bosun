name: "CI"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: "Build + Tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Prepublish check (files array + import validation)
        run: node tools/prepublish-check.mjs

      - name: Prompt lint
        run: npm run prompt:lint

      - name: Packed CLI smoke test
        run: npm run smoke:packed-cli

      - name: Run build
        run: npm run build

      - name: Audit conformity gate
        if: ${{ vars.BOSUN_AUDIT_CI == '1' }}
        run: npm run audit:ci

      - name: Native call parity gate
        run: npm run check:native-call-parity

      - name: Run tests
        run: npm test

