# Publish bosun to npm via OIDC Trusted Publishing
#
# Triggers:
#   1. Push to main that changes package.json or source files
#   2. Manual dispatch with optional version bump / force flag
#
# A successful publish also creates the matching git tag (`vX.Y.Z`) and GitHub
# release, so the npm version, the git tag, and the GitHub release record can
# never drift apart. Both steps are idempotent: an existing tag or release is
# left untouched.
#
# Prerequisites (one-time setup):
#   Configure Trusted Publisher on npmjs.com:
#     Package → Settings → Publishing Access → Add Trusted Publisher
#       - Organization: virtengine
#       - Repository: bosun
#       - Workflow filename: publish.yaml
#       - Environment: npm-publish
#   Configure GitHub environment:
#     Repo → Settings → Environments → Create "npm-publish"

name: "Publish to npm"

env:
  NODE_VERSION: "24"

on:
  push:
    branches: [main]
    paths:
      - "**/*.mjs"
      - "package.json"
      - "package-lock.json"
      - "!.env*"
      - "!logs/**"
      - "!*.config.json"
      - "!workspaces.json"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Dry run (skip actual publish)"
        type: boolean
        default: false
      force:
        description: "Force publish even if version unchanged"
        type: boolean
        default: false

concurrency:
  group: bosun-publish
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  check:
    name: Version Check
    runs-on: ubuntu-latest
    outputs:
      should-publish: ${{ steps.compare.outputs.should-publish }}
      local-version: ${{ steps.compare.outputs.local-version }}
      registry-version: ${{ steps.compare.outputs.registry-version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: "https://registry.npmjs.org"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Compare versions
        id: compare
        run: |
          LOCAL=$(node -p "require('./package.json').version")
          echo "local-version=$LOCAL" >> "$GITHUB_OUTPUT"

          # A failed lookup must NOT become a version. The inline comparison this
          # replaces fell back to "0.0.0", which every released version exceeds, so
          # a dropped connection turned into a publish attempt at an unchanged
          # version. Pass the failure through as the gate's "unknown" sentinel and
          # let tools/publish-version-gate.mjs fail closed.
          REGISTRY=$(npm view bosun version 2>/dev/null || echo "")
          echo "registry-version=${REGISTRY:-unknown}" >> "$GITHUB_OUTPUT"

          # Single decision point. The module owns semver precedence (including
          # prereleases, which the old Number()-per-component compare mis-ordered:
          # "0.43.2-beta.1" put NaN in the patch slot, so every comparison was
          # false and a legitimate bump silently skipped the release).
          # No `|| true`: the gate exits 0 for BOTH publish and skip, and non-zero
          # only when it is broken, so its exit status stays a usable error signal.
          DECISION=$(node tools/publish-version-gate.mjs \
            "$LOCAL" "${REGISTRY:-unknown}" "${{ inputs.force }}")
          echo "$DECISION"

          SHOULD_PUBLISH=$(node -p "JSON.parse(process.argv[1]).shouldPublish" "$DECISION")
          REASON=$(node -p "JSON.parse(process.argv[1]).reason" "$DECISION")
          echo "should-publish=$SHOULD_PUBLISH" >> "$GITHUB_OUTPUT"

          if [ "$SHOULD_PUBLISH" = "true" ]; then
            echo ":box: Will publish: $LOCAL (registry: ${REGISTRY:-unknown})"
          else
            echo ":play: Skipping: $REASON"
          fi

  publish:
    name: Publish to npm
    needs: check
    if: needs.check.outputs.should-publish == 'true'
    runs-on: ubuntu-latest
    environment: npm-publish
    # Job-level permissions replace the workflow-level block, so both grants
    # have to be repeated here.
    permissions:
      contents: write # push the release tag and create the GitHub release
      id-token: write # OIDC trusted publishing + npm provenance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: "https://registry.npmjs.org"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Prepublish check
        run: node tools/prepublish-check.mjs

      - name: Packed CLI smoke test
        run: npm run smoke:packed-cli

      - name: Test
        run: npm test

      - name: Publish
        if: ${{ !inputs.dry-run }}
        run: npm publish --access public --provenance

      - name: Publish (dry run)
        if: ${{ inputs.dry-run }}
        run: npm publish --access public --dry-run

      - name: Tag release and create GitHub release
        if: ${{ !inputs.dry-run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.check.outputs.local-version }}"

          # The tag is a published, effectively-immutable ref, and it is built by
          # concatenating a value that reached this step through a shell
          # expression. The gate (tools/publish-version-gate.mjs) refuses an
          # unparseable local version — including under force, which cannot
          # override that stop (`forceable: false`, reason "force does NOT
          # override this") — but `npm publish --dry-run` does not: it accepts
          # `v0.44.0` (rc=0), which this concatenation would have turned into the
          # remote tag `vv0.44.0`. So the last point before the ref is created
          # re-checks the shape itself rather than trusting that every path into
          # this step passed the gate.
          #
          # Note this guard is NOT identical to the gate's notion of valid. The
          # gate ACCEPTS build metadata (`0.44.0+build` is legal semver and will
          # publish); this grep REFUSES it, so such a version publishes to npm but
          # stops here before the tag. That is deliberate — a tag carries the bare
          # version, and stripping `+build` here would create a tag that does not
          # match the published version. Keep the two rules separate; do not
          # "simplify" this by trusting the gate alone.
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::local version '$VERSION' is not \`MAJOR.MINOR.PATCH[-pre]\`; refusing to create tag 'v$VERSION'"
            exit 1
          fi

          TAG="v$VERSION"

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo ":play: Tag $TAG already exists — leaving it untouched."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "bosun $VERSION"
            git push origin "refs/tags/$TAG"
            echo ":check: Created and pushed tag $TAG."
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo ":play: Release $TAG already exists — leaving it untouched."
          else
            gh release create "$TAG" \
              --title "bosun $TAG" \
              --generate-notes
            echo ":check: Created GitHub release $TAG."
          fi

      # Ordering is load-bearing, and the reason is the trap this step used to
      # sit on the wrong side of. `npm publish` is the one irreversible action
      # here and it has already happened by now, so a registry mismatch must NOT
      # be allowed to abort the job before the tag and the GitHub release exist
      # — that would leave npm ahead of its own release record, which is exactly
      # the drift the workflow header promises cannot happen. So the tag and the
      # release record are created first, and this step then measures the
      # registry and FAILS LOUDLY if it disagrees.
      #
      # It previously ran BEFORE the tag/release step and only echoed
      # ":alert: Registry shows X, expected Y" on a mismatch, exiting 0 — so the
      # single step that measures the workflow's core invariant could not fail.
      - name: Verify publication
        if: ${{ !inputs.dry-run }}
        id: verify
        env:
          EXPECTED_VERSION: ${{ needs.check.outputs.local-version }}
        run: |
          echo ":clock: Waiting for registry propagation..."
          # Bounded retry: a publish that succeeded is often visible in seconds,
          # but the registry's read replica can lag. Retrying here is safe because
          # the tag and release records already exist — a late registry is a
          # reportable event, not a reason to create refs.
          PUBLISHED="NOT_FOUND"
          for attempt in 1 2 3 4 5 6; do
            sleep 10
            PUBLISHED=$(npm view bosun version 2>/dev/null || echo "NOT_FOUND")
            if [ "$PUBLISHED" = "$EXPECTED_VERSION" ]; then
              break
            fi
            echo ":hourglass: attempt $attempt/6: registry shows $PUBLISHED, expected $EXPECTED_VERSION"
          done

          if [ "$PUBLISHED" = "$EXPECTED_VERSION" ]; then
            echo ":check: Successfully published bosun@$PUBLISHED"
            echo "registry version verified: $PUBLISHED" >> "$GITHUB_OUTPUT"
          else
            # A real non-zero exit. The tag and the GitHub release for
            # $EXPECTED_VERSION already exist, so this failure is legible: the
            # run is red, and re-running the publish job is safe (both the tag
            # and the release step are idempotent and leave existing refs alone).
            echo "::error::Registry shows $PUBLISHED after 6 attempts, expected $EXPECTED_VERSION. bosun@$EXPECTED_VERSION was not observed on npm even though tag v$EXPECTED_VERSION and its release record were created. This is real npm/tag/release drift — see RELEASE.md before deleting anything."
            exit 1
          fi

      - name: Summary
        run: |
          echo "## :box: Bosun Publish" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Package | \`bosun\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Version | \`${{ needs.check.outputs.local-version }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Tag | \`v${{ needs.check.outputs.local-version }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Previous | \`${{ needs.check.outputs.registry-version }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Dry Run | \`${{ inputs.dry-run || 'false' }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Trigger | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
