name: CodeQL

# Why both branches are listed:
# The estate merges into `develop` first (ESTATE standing rule 1), so gating only
# on `main` meant no develop-based PR ever got a PR-level SAST scan. The weekly
# `schedule` still runs, but it only reports on whatever `main` was that Monday.
on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  schedule:
    - cron: "27 3 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout-minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            timeout-minutes: 30
          - language: javascript-typescript
            timeout-minutes: 120
          - language: rust
            timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
